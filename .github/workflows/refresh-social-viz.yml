name: Refresh social-viz
on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab
permissions:
  contents: write
concurrency:
  group: refresh-social-viz
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build snapshot from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: pewdiepie-archdaemon/odysseus
        run: bash build.sh
      - name: Commit & push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js data.json
          if git diff --cached --quiet; then
            echo "No changes in snapshot."
          else
            git commit -m "chore(social-viz): refresh snapshot $(date -u +%FT%TZ)"
            git push
          fi
